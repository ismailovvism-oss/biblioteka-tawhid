<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6259"/></marker></defs><rect width="680" height="340" fill="#ffffff"/>
<rect x="205" y="8" width="270" height="44" rx="7" fill="#f7f5f0" stroke="#a89f92" stroke-width="1.2"/>
<text x="340" y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">Человек отрицает</text>
<text x="340" y="43" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">возвышенность Аллаха</text>
<text x="340" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">Что именно он отрицает?</text>
<line x1="340" y1="52" x2="340" y2="62" stroke="#6b6259" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="300" y1="84" x2="172" y2="104" stroke="#6b6259" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="380" y1="84" x2="508" y2="104" stroke="#6b6259" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="12" y="106" width="320" height="52" rx="7" fill="#f7f5f0" stroke="#a89f92" stroke-width="1.2"/>
<text x="172" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">отделённость от творения:</text>
<text x="172" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">«Аллах везде» — Он внутри мира</text>
<rect x="348" y="106" width="320" height="52" rx="7" fill="#f7f5f0" stroke="#a89f92" stroke-width="1.2"/>
<text x="508" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">нахождение Аллаха</text>
<text x="508" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">в сотворённом месте</text>
<line x1="172" y1="158" x2="172" y2="176" stroke="#6b6259" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="508" y1="158" x2="508" y2="176" stroke="#6b6259" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="12" y="178" width="320" height="96" rx="7" fill="#f6e2e2" stroke="#b04a4a" stroke-width="1.2"/>
<text x="172" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622" font-weight="bold">Разряд 1 · основа · куфр</text>
<text x="172" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">снесено различение Творца</text>
<text x="172" y="239" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">и созданного. Сюда падает такфир</text>
<text x="172" y="256" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">саляфов и слова Ибн Хузаймы</text>
<rect x="348" y="178" width="320" height="96" rx="7" fill="#f4efdd" stroke="#b08a2c" stroke-width="1.2"/>
<text x="508" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622" font-weight="bold">Разряд 2 · заблуждение</text>
<text x="508" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">отводит ровно то, что отводят</text>
<text x="508" y="239" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">и утверждающие возвышенность;</text>
<text x="508" y="256" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">ошибка — в лишней посылке</text>
<text x="340" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b6259" font-style="italic">Пока вопрос не задан, ни один нукуль о такфире за улувв к делу не приложим:</text>
<text x="340" y="318" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b6259" font-style="italic">он говорит о левом случае, а спорят о правом</text>
</svg>