<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 382" width="660" height="382"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6259"/></marker></defs><rect width="660" height="382" fill="#ffffff"/>
<text x="330" y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b2622">Тавиль качества — три разряда и три хукма</text>
<rect x="10" y="46" width="250" height="96" rx="7" fill="#f7f5f0" stroke="#a89f92" stroke-width="1.2"/>
<text x="135" y="73" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622" font-weight="bold">Разряд 1</text>
<text x="135" y="90" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">качества, без которых</text>
<text x="135" y="107" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">быть Богом невозможно:</text>
<text x="135" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">могущество, знание, жизнь</text>
<line x1="264" y1="94" x2="286" y2="94" stroke="#6b6259" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="290" y="46" width="340" height="96" rx="7" fill="#f6e2e2" stroke="#b04a4a" stroke-width="1.2"/>
<text x="460" y="73" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622" font-weight="bold">Куфр джахли</text>
<text x="460" y="90" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">задета основа таухида;</text>
<text x="460" y="107" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">незнание не оправдывает —</text>
<text x="460" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">оно и есть то, чего недостаёт</text>
<rect x="10" y="158" width="250" height="96" rx="7" fill="#f7f5f0" stroke="#a89f92" stroke-width="1.2"/>
<text x="135" y="185" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622" font-weight="bold">Разряд 2</text>
<text x="135" y="202" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">качества совершенства:</text>
<text x="135" y="219" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">Рука, Стопа, смех,</text>
<text x="135" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">довольство</text>
<line x1="264" y1="206" x2="286" y2="206" stroke="#6b6259" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="290" y="158" width="340" height="96" rx="7" fill="#f4efdd" stroke="#b08a2c" stroke-width="1.2"/>
<text x="460" y="194" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622" font-weight="bold">Заблуждение, не куфр</text>
<text x="460" y="211" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">основа цела; куфром станет,</text>
<text x="460" y="228" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">только пройдя через разряд 3</text>
<rect x="10" y="270" width="250" height="96" rx="7" fill="#f7f5f0" stroke="#a89f92" stroke-width="1.2"/>
<text x="135" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622" font-weight="bold">Разряд 3</text>
<text x="135" y="323" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">к тавилю добавлен такзиб —</text>
<text x="135" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">отвергнут сам насс</text>
<line x1="264" y1="318" x2="286" y2="318" stroke="#6b6259" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="290" y="270" width="340" height="96" rx="7" fill="#f6e2e2" stroke="#b04a4a" stroke-width="1.2"/>
<text x="460" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622" font-weight="bold">Куфр такзиба</text>
<text x="460" y="323" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">приговор по мере сознательности;</text>
<text x="460" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#2b2622">худжа прежде такфира</text>
<text x="330" y="374" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b6259" font-style="italic">Возвышенность входит сюда не целиком — см. развилку ниже</text>
</svg>